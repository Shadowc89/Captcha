<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Secure group verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
  <script>window.onHCaptchaLoaded = function () { window.hcaptchaReady = true; if (window.initializeCaptcha) window.initializeCaptcha(); };</script>
  <script src="https://js.hcaptcha.com/1/api.js?onload=onHCaptchaLoaded&render=explicit" async defer></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      color: var(--tg-theme-text-color, #eef3fa);
      background: #0b1320;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: var(--tg-theme-hint-color, #8c9bad);
      --line: rgba(174, 195, 218, .12);
      --accent: #69d1c2
    }

    * {
      box-sizing: border-box
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) 22px max(20px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      place-items: center;
      background: radial-gradient(ellipse at 50% 42%, rgba(45, 81, 106, .22), transparent 49%), linear-gradient(145deg, #0b1320, #101b29 52%, #0b1420)
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(100%, 480px)
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 4px 22px
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #edf3f8;
      text-decoration: none
    }

    .brand-mark {
      display: flex;
      width: 27px;
      height: 27px;
      align-items: flex-end;
      gap: 3px;
      padding: 5px;
      border: 1px solid rgba(105, 209, 194, .35);
      border-radius: 9px;
      background: rgba(105, 209, 194, .08)
    }

    .brand-mark span {
      width: 4px;
      border-radius: 4px;
      background: var(--accent)
    }

    .brand-mark span:nth-child(1) {
      height: 8px;
      opacity: .7
    }

    .brand-mark span:nth-child(2) {
      height: 13px
    }

    .brand-mark span:nth-child(3) {
      height: 10px;
      opacity: .85
    }

    .brand-name {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em
    }

    .secure-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #aebdca;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em
    }

    .secure-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #68d4a6;
      box-shadow: 0 0 12px rgba(104, 212, 166, .55)
    }

    .verification-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(175, 200, 222, .15);
      border-radius: 25px;
      background: linear-gradient(145deg, rgba(22, 36, 52, .98), rgba(15, 27, 41, .98));
      box-shadow: 0 30px 90px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .035)
    }

    .card-glow {
      position: absolute;
      top: -170px;
      left: 50%;
      width: 390px;
      height: 300px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(73, 168, 165, .13);
      filter: blur(80px);
      pointer-events: none
    }

    .card-content {
      position: relative;
      padding: 35px 32px 26px;
      text-align: center
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #86a2b1;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .19em
    }

    .eyebrow-line {
      width: 18px;
      height: 1px;
      background: #5e9f9b
    }

    .shield {
      display: grid;
      width: 68px;
      height: 68px;
      margin: 25px auto 15px;
      place-items: center;
      border: 1px solid rgba(105, 209, 194, .24);
      border-radius: 22px;
      color: #81ded0;
      background: linear-gradient(145deg, rgba(97, 195, 181, .14), rgba(56, 114, 127, .08));
      box-shadow: 0 0 32px rgba(79, 177, 164, .1), inset 0 1px 0 rgba(255, 255, 255, .06)
    }

    .shield svg {
      width: 36px;
      height: 36px
    }

    .step-label {
      margin: 0 0 7px;
      color: #8aa0b0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .15em
    }

    h1 {
      margin: 0;
      color: #f2f6fa;
      font-size: clamp(25px, 7vw, 31px);
      font-weight: 700;
      letter-spacing: -.045em
    }

    .description {
      max-width: 320px;
      margin: 10px auto 24px;
      color: #9aaaba;
      font-size: 14px;
      line-height: 1.65
    }

    .challenge-frame {
      display: grid;
      min-height: 80px;
      padding: 10px;
      place-items: center;
      border: 1px solid rgba(174, 195, 218, .11);
      border-radius: 14px;
      background: rgba(5, 13, 23, .3)
    }

    #challenge {
      display: flex;
      min-width: 0;
      min-height: 64px;
      justify-content: center;
      align-items: center
    }

    .verify-button {
      display: flex;
      width: 100%;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      padding: 0 20px;
      border: 1px solid rgba(155, 237, 220, .4);
      border-radius: 13px;
      color: #0a201f;
      background: linear-gradient(110deg, #8be1cf, #65cabb);
      box-shadow: 0 9px 24px rgba(70, 186, 169, .14);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: transform .18s ease, filter .18s ease, opacity .18s ease
    }

    .verify-button:not(:disabled):hover {
      filter: brightness(1.06);
      transform: translateY(-1px)
    }

    .verify-button:disabled {
      cursor: not-allowed;
      opacity: .45
    }

    .verify-button:focus-visible {
      outline: 3px solid rgba(139, 225, 207, .4);
      outline-offset: 3px
    }

    .button-arrow {
      width: 17px;
      height: 17px
    }

    .status {
      min-height: 21px;
      margin: 11px 0 0;
      color: #a7b5c3;
      font-size: 12px;
      line-height: 1.5
    }

    .status[data-kind=error] {
      color: #ff9d9d
    }

    .status[data-kind=success] {
      color: #84ddbb
    }

    .status:empty {
      min-height: 13px;
      margin-top: 4px
    }

    .card-divider {
      height: 1px;
      margin: 16px 0;
      background: linear-gradient(90deg, transparent, var(--line) 15%, var(--line) 85%, transparent)
    }

    .privacy-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #7e91a2;
      font-size: 11px;
      line-height: 1.5
    }

    .privacy-note svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      color: #79b8ae
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 19px 8px 0;
      color: #687b8c;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .13em;
      text-align: center
    }

    .footer-divider {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #638b8c
    }

    .ambient {
      position: fixed;
      z-index: 0;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(105, 209, 194, .035);
      border-radius: 50%;
      pointer-events: none
    }

    .ambient:after {
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(105, 209, 194, .035);
      border-radius: inherit;
      content: ""
    }

    .ambient-one {
      top: -160px;
      right: -100px
    }

    .ambient-two {
      bottom: -190px;
      left: -130px;
      transform: scale(1.35)
    }

    html[dir=rtl] .button-arrow {
      transform: rotate(180deg)
    }

    [hidden] {
      display: none !important
    }

    @media(max-width:420px) {
      body {
        padding-right: 15px;
        padding-left: 15px
      }

      .card-content {
        padding: 29px 20px 22px
      }

      .description {
        font-size: 13px
      }

      .footer {
        font-size: 8px;
        letter-spacing: .1em
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *:before,
      *:after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important
      }
    }

    @media(prefers-color-scheme:light) {
      :root {
        color-scheme: light;
        color: var(--tg-theme-text-color, #17212b);
        --line: rgba(57, 76, 96, .13)
      }

      body {
        background: radial-gradient(ellipse at 50% 42%, rgba(98, 177, 173, .12), transparent 50%), linear-gradient(145deg, #edf3f6, #e4edf0 52%, #f4f6f5)
      }

      .brand {
        color: #172c3b
      }

      .secure-label {
        color: #587080
      }

      .verification-card {
        border-color: rgba(59, 91, 112, .13);
        background: linear-gradient(145deg, rgba(255, 255, 255, .97), rgba(246, 250, 250, .98));
        box-shadow: 0 28px 80px rgba(35, 66, 82, .13), inset 0 1px 0 white
      }

      .eyebrow,
      .step-label {
        color: #62808c
      }

      h1 {
        color: #193044
      }

      .description {
        color: #687d8a
      }

      .challenge-frame {
        border-color: rgba(60, 88, 105, .12);
        background: rgba(237, 243, 245, .72)
      }

      .status {
        color: #637985
      }

      .status[data-kind=error] {
        color: #b53d47
      }

      .status[data-kind=success] {
        color: #168268
      }

      .privacy-note,
      .footer {
        color: #748994
      }
    }

    :root {
      color-scheme: dark;
      color: #fafafa;
      background: #0c0c0d;
      --accent: #f4f4f5;
      --line: rgba(231, 231, 234, .18)
    }

    body {
      color: #fafafa;
      background:
        radial-gradient(ellipse at 13% 13%, rgba(255, 255, 255, .13), transparent 32%),
        radial-gradient(ellipse at 89% 77%, rgba(170, 174, 181, .12), transparent 36%),
        linear-gradient(145deg, #09090a, #202124 53%, #101112)
    }

    .ambient {
      opacity: .8;
      border-color: rgba(235, 235, 238, .17);
      animation: float-orbit 11s ease-in-out infinite alternate
    }

    .ambient:after {
      border-color: rgba(176, 179, 184, .2)
    }

    .ambient-two {
      animation-delay: -5s
    }

    .brand,
    .secure-label,
    .eyebrow,
    .step-label,
    h1,
    .description,
    .status,
    .privacy-note,
    .footer {
      color: #f7f7f8
    }

    .brand-mark {
      border-color: rgba(245, 245, 246, .5);
      background: linear-gradient(145deg, rgba(255, 255, 255, .22), rgba(128, 130, 134, .2));
      box-shadow: 0 5px 24px rgba(235, 235, 238, .14)
    }

    .brand-mark span {
      background: linear-gradient(180deg, #fff, #aeb0b5)
    }

    .secure-dot {
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, .1), 0 0 17px rgba(255, 255, 255, .78);
      animation: dot-pulse 2s ease-in-out infinite
    }

    .eyebrow {
      color: #e4e4e7
    }

    .eyebrow-line {
      background: linear-gradient(90deg, #fff, #92949a)
    }

    .step-label {
      color: #d4d4d8
    }

    .verification-card {
      border-color: rgba(235, 235, 239, .27);
      background: linear-gradient(145deg, rgba(39, 40, 43, .97), rgba(19, 20, 22, .98));
      box-shadow: 0 28px 90px rgba(0, 0, 0, .55), 0 0 48px rgba(220, 220, 224, .1), inset 0 1px 0 rgba(255, 255, 255, .12);
      transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease
    }

    @media (hover:hover) and (pointer:fine) {
      .verification-card:hover {
        transform: translateY(-4px);
        border-color: rgba(255, 255, 255, .52);
        box-shadow: 0 34px 100px rgba(0, 0, 0, .62), 0 0 62px rgba(235, 235, 239, .16), inset 0 1px 0 rgba(255, 255, 255, .15)
      }
    }

    .card-glow {
      background: radial-gradient(ellipse at 50% 0, rgba(255, 255, 255, .17), transparent 65%);
      animation: silver-glow 4.2s ease-in-out infinite alternate
    }

    .shield {
      color: #fff;
      border-color: rgba(255, 255, 255, .42);
      background: linear-gradient(145deg, rgba(255, 255, 255, .19), rgba(112, 114, 119, .16));
      box-shadow: 0 0 36px rgba(235, 235, 239, .16), inset 0 1px 0 rgba(255, 255, 255, .16);
      animation: shield-float 3.4s ease-in-out infinite
    }

    .challenge-frame {
      border-color: rgba(220, 220, 224, .23);
      background: linear-gradient(135deg, rgba(8, 8, 9, .78), rgba(55, 56, 60, .52));
      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease
    }

    .challenge-frame:focus-within {
      border-color: rgba(255, 255, 255, .72);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .1), 0 8px 30px rgba(210, 210, 215, .12)
    }

    .status[data-kind=loading] {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #f0f0f2
    }

    .status[data-kind=loading]:before {
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255, 255, 255, .28);
      border-top-color: #fff;
      border-radius: 50%;
      content: "";
      animation: spin .75s linear infinite
    }

    .status[data-kind=error] {
      color: #e4e4e7
    }

    .status[data-kind=success] {
      color: #fff;
      text-shadow: 0 0 18px rgba(255, 255, 255, .28)
    }

    .privacy-note svg {
      color: #d4d4d8
    }

    .footer-divider {
      background: linear-gradient(90deg, #fff, #92949a)
    }

    @keyframes dot-pulse {
      50% {
        box-shadow: 0 0 0 7px rgba(255, 255, 255, .04), 0 0 21px rgba(255, 255, 255, .96)
      }
    }

    @keyframes shield-float {
      50% {
        transform: translateY(-3px) rotate(-2deg)
      }
    }

    @keyframes float-orbit {
      to {
        transform: translate3d(-16px, 13px, 0) scale(1.06)
      }
    }

    @keyframes silver-glow {
      to {
        opacity: .58;
        transform: scale(1.08)
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .ambient,
      .secure-dot,
      .shield,
      .card-glow,
      .status[data-kind=loading]:before {
        animation: none !important
      }
    }
  </style>
</head>

      ru: { secure: "Защищённая проверка", eyebrow: "ДОСТУП К СООБЩЕСТВУ", step: "ОДИН ПРОСТОЙ ШАГ", title: "Подтвердите, что вы человек", description: "Пройдите короткую проверку, чтобы перейти в группу.", loading: "Проверяем ответ…", failed: "Проверка не пройдена. Попробуйте ещё раз.", attempts: "Осталось попыток: {count}.", expired: "Срок действия ссылки истёк. Запросите новую у бота.", unavailable: "Проверка временно недоступна.", success: "Проверка пройдена. Можно вернуться в группу.", privacy: "Проверка используется только для доступа в группу.", footer: "Безопасное сообщество начинается с вас." },
      sp: { secure: "Comprobación segura", eyebrow: "ACCESO A LA COMUNIDAD", step: "UN PASO RÁPIDO", title: "Confirma que eres una persona", description: "Completa esta comprobación para continuar al grupo.", loading: "Comprobando tu respuesta…", failed: "La comprobación no se completó. Inténtalo de nuevo.", attempts: "Intentos restantes: {count}.", expired: "Este enlace ha caducado. Pide uno nuevo al bot.", unavailable: "La verificación no está disponible temporalmente.", success: "Verificación completada. Puedes volver al grupo.", privacy: "Tu verificación solo se usa para acceder al grupo.", footer: "Un espacio más seguro empieza contigo." }
    };
    const tg = window.Telegram && window.Telegram.WebApp;
    const language = (tg?.initDataUnsafe?.user?.language_code || "en").toLowerCase().split("-")[0];
    const copy = translations[language] || translations.en;
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || new URLSearchParams(location.hash.slice(1)).get("token") || "";
    const apiUrl = params.get("api") || "";
    const status = document.getElementById("status");
    let widget = null;
    let started = false;
    let submitted = false;

    document.documentElement.lang = language;
    document.documentElement.dir = language === "ar" || language === "qr" ? "rtl" : "ltr";
    for (const [id, key] of [["secure-label", "secure"], ["eyebrow", "eyebrow"], ["step-label", "step"], ["title", "title"], ["description", "description"], ["privacy-note", "privacy"], ["footer-copy", "footer"]]) {
      document.getElementById(id).textContent = copy[key];
    }
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function message(text, kind = "") {
      status.textContent = text;
      status.dataset.kind = kind;
    }

    const landing = {
      ar: ["تطبيق Hyper Help", "افتح رابط التحقق الذي أرسله البوت لبدء الفحص."],
      qr: ["تطبيق Hyper Help", "افتح رابط التحقق الذي أرسله البوت لبدء الفحص."],
      en: ["Hyper Help Check", "Open the verification link sent by the bot to start your check."],
      de: ["Hyper Help Check", "Öffne den Prüfungslink des Bots, um die Prüfung zu starten."],
      fr: ["Mini-app Hyper Help", "Ouvrez le lien de vérification envoyé par le bot pour commencer."],
      ru: ["Мини-приложение Hyper Help", "Откройте ссылку проверки от бота, чтобы начать."],
      sp: ["Mini aplicaci?n Hyper Help", "Abre el enlace de verificaci?n del bot para comenzar."]
    };

    if (!token) {
      document.getElementById("title").textContent = landing[language]?.[0] || landing.en[0];
      document.getElementById("description").textContent = landing[language]?.[1] || landing.en[1];
      document.querySelector(".step-label").hidden = true;
      document.querySelector(".challenge-frame").hidden = true;
      started = true;
    }

    async function submitResponse(response) {
      if (submitted) return;
      if (!tg?.initData || !apiUrl) {
        message(copy.unavailable, "error");
        return;
      }
      submitted = true;
      message(copy.loading, "loading");
      try {
        const result = await fetch(`${apiUrl}/captcha/verify`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({ init_data: tg.initData, session_token: token, hcaptcha_response: response })
        });
        const payload = await result.json();
        if (payload.ok) {
          message(copy.success, "success");
          window.setTimeout(() => tg.close(), 900);
          return;
        }
        if (payload.error === "session_expired" || payload.error === "session_used") {
          message(copy.expired, "error");
          return;
        }
        if (payload.error === "attempts_exhausted") {
          message(copy.expired, "error");
          return;
        }
        if (payload.error === "captcha_failed") {
          message(copy.attempts.replace("{count}", String(payload.attempts_left ?? 0)), "error");
        } else {
          message(copy.unavailable, "error");
        }
        submitted = false;
        if (widget !== null && window.hcaptcha) window.hcaptcha.reset(widget);
      } catch (_) {
        submitted = false;
        message(copy.unavailable, "error");
        if (widget !== null && window.hcaptcha) window.hcaptcha.reset(widget);
      }
    }

    window.initializeCaptcha = function () {
      if (started) return;
      started = true;
      if (!token || !apiUrl || !tg?.initData) {
        message(copy.expired, "error");
        return;
      }
      fetch(`${apiUrl}/captcha/config`, { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error("config_unavailable");
          return response.json();
        })
        .then(({ sitekey }) => {
          if (!sitekey) throw new Error("missing_sitekey");
          widget = window.hcaptcha.render("challenge", {
            sitekey,
            theme: "dark",
            callback: submitResponse,
            "expired-callback": () => message(copy.failed, "error"),
            "error-callback": () => message(copy.unavailable, "error")
          });
        })
        .catch(() => {
          message(copy.unavailable, "error");
          started = false;
        });
    };

    if (window.hcaptchaReady) window.initializeCaptcha();
  </script>
